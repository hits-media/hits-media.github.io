<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punch Machine</title>

<style>
body {
  margin:0;
  background:#020617;
  color:white;
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

#score { font-size:70px; margin:20px; }
#status { opacity:0.7; }

button {
  padding:12px;
  margin:6px;
  border:none;
  border-radius:10px;
}
.primary { background:#22c55e; }
.secondary { background:#334155; color:white; }
</style>
</head>

<body>

<h2>🥊 Punch</h2>
<div id="score">0000</div>
<div id="status">Başlat</div>

<button class="primary" onclick="startPermission()">Başlat</button>
<button class="secondary" onclick="calibrate()">Kalibrasyon</button>

<script>
// ===== STATE =====
let axis="x";
let baseline=0;

let state="idle";
let windowData=[];
let windowStart=0;

let lastTime=0;
let lastAccel=0;

// ===== PERMISSION =====
function startPermission(){
  if (DeviceMotionEvent.requestPermission){
    DeviceMotionEvent.requestPermission().then(r=>{
      if(r==="granted") start();
    });
  } else start();
}

function start(){
  window.addEventListener("devicemotion", handle);
  document.getElementById("status").innerText="Hazır";
}

// ===== CALIBRATION =====
function calibrate(){
  let samples=[];
  document.getElementById("status").innerText="Kalibrasyon...";

  function collect(e){
    let a=e.accelerationIncludingGravity;
    if(!a) return;

    samples.push({x:a.x,y:a.y,z:a.z});

    if(samples.length>60){
      window.removeEventListener("devicemotion",collect);

      let avg={x:0,y:0,z:0};
      samples.forEach(s=>{
        avg.x+=s.x; avg.y+=s.y; avg.z+=s.z;
      });

      avg.x/=samples.length;
      avg.y/=samples.length;
      avg.z/=samples.length;

      let ax=Math.abs(avg.x), ay=Math.abs(avg.y), az=Math.abs(avg.z);

      axis = ax>ay && ax>az ? "x" : (ay>az ? "y":"z");
      baseline = avg[axis];

      document.getElementById("status").innerText="Kalibre edildi";
    }
  }

  window.addEventListener("devicemotion",collect);
}

// ===== MAIN =====
function handle(e){

  let now=Date.now();
  let dt=(now-lastTime)/1000||0.016;

  let a=e.accelerationIncludingGravity;
  if(!a) return;

  let val=(a[axis]||0)-baseline;

  let jerk=(val-lastAccel)/dt;

  lastAccel=val;
  lastTime=now;

  // ===== ARMING (geri çekme) =====
  if(state==="idle" && val < -8){
    state="armed";
    document.getElementById("status").innerText="Hazırla → vur";
  }

  // ===== EVENT START =====
  if(state==="armed" && val > 16){
    state="record";
    windowData=[];
    windowStart=now;
  }

  // ===== RECORD WINDOW =====
  if(state==="record"){

    windowData.push({v:val,t:now});

    if(now-windowStart > 220){
      processWindow();
      state="idle";
      document.getElementById("status").innerText="Hazır";
    }
  }
}

// ===== PROCESS =====
function processWindow(){

  if(windowData.length < 10) return;

  // peak
  let peak = Math.max(...windowData.map(d=>d.v));

  // impulse
  let impulse=0;
  for(let i=1;i<windowData.length;i++){
    let dt=(windowData[i].t-windowData[i-1].t)/1000;
    impulse += Math.max(0, windowData[i].v) * dt;
  }

  // jerk peak
  let jerkPeak=0;
  for(let i=1;i<windowData.length;i++){
    let dv=windowData[i].v-windowData[i-1].v;
    let dt=(windowData[i].t-windowData[i-1].t)/1000;
    jerkPeak=Math.max(jerkPeak, Math.abs(dv/dt));
  }

  // ===== FILTERS =====
  if(peak < 18) return;
  if(jerkPeak < 25) return;
  if(impulse < 1.2) return;

  // ===== SCORE (çok daha zor) =====
  let raw =
    peak*0.4 +
    impulse*25 +
    jerkPeak*0.15;

  let score = 9999 * Math.pow(1 - Math.exp(-raw/55), 2.2);

  score = Math.min(9999, Math.floor(score));

  show(score);
}

// ===== UI =====
function show(val){
  document.getElementById("score").innerText =
    val.toString().padStart(4,"0");

  if(navigator.vibrate){
    navigator.vibrate([20,10,Math.min(200,val/25)]);
  }
}
</script>

</body>
</html>

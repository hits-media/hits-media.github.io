<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punch Machine Pro</title>

<style>
body {
  margin:0;
  font-family: system-ui;
  background: radial-gradient(circle at top, #1e293b, #020617);
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

h1 { font-size:28px; margin-bottom:10px; }

#score {
  font-size:72px;
  letter-spacing:6px;
  margin:10px;
  transition: transform 0.2s;
}

#type {
  font-size:18px;
  opacity:0.8;
}

#status {
  margin:10px;
  opacity:0.7;
}

.controls {
  margin-top:15px;
}

button {
  padding:12px 18px;
  margin:6px;
  border-radius:12px;
  border:none;
  font-size:15px;
  cursor:pointer;
}

.primary { background:#22c55e; color:black; }
.secondary { background:#334155; color:white; }

.bar {
  width:200px;
  height:8px;
  background:#1e293b;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.fill {
  height:100%;
  width:0%;
  background:#22c55e;
  transition:width 0.1s;
}
</style>
</head>

<body>

<h1>🥊 Punch Machine</h1>

<div id="score">0000</div>
<div id="type">—</div>

<div class="bar"><div id="powerBar" class="fill"></div></div>

<div id="status">Başlat</div>

<div class="controls">
<button class="primary" onclick="requestPermission()">Başlat</button>
<button class="secondary" onclick="calibrate()">Kalibrasyon</button>
</div>

<script>
// ================= STATE =================
let state = "idle";

let baseline = 0;
let axis = "x";

let lastAccel = 0;
let lastTime = 0;

let peakAccel = 0;
let peakGyro = 0;
let jerkPeak = 0;
let startTime = 0;

let samples = [];

// ================= PERMISSION =================
function requestPermission() {
  if (typeof DeviceMotionEvent.requestPermission === "function") {
    DeviceMotionEvent.requestPermission().then(res => {
      if (res === "granted") start();
    });
  } else start();
}

function start() {
  document.getElementById("status").innerText = "Hazır - geri çek";
  window.addEventListener("devicemotion", handleMotion);
}

// ================= CALIBRATION =================
function calibrate() {
  samples = [];
  document.getElementById("status").innerText = "Kalibrasyon... sabit tut";

  let count = 0;

  function collect(e) {
    let a = e.accelerationIncludingGravity;
    if (!a) return;

    samples.push({x:a.x||0,y:a.y||0,z:a.z||0});
    count++;

    if (count > 60) {
      window.removeEventListener("devicemotion", collect);

      let avg = {x:0,y:0,z:0};

      samples.forEach(s=>{
        avg.x+=s.x; avg.y+=s.y; avg.z+=s.z;
      });

      avg.x/=count; avg.y/=count; avg.z/=count;

      let ax=Math.abs(avg.x), ay=Math.abs(avg.y), az=Math.abs(avg.z);

      axis = ax>ay && ax>az ? "x" : (ay>az ? "y":"z");
      baseline = avg[axis];

      document.getElementById("status").innerText =
        "Kalibre edildi ("+axis+")";
    }
  }

  window.addEventListener("devicemotion", collect);
}

// ================= MAIN =================
function handleMotion(e) {

  let now = Date.now();
  let acc = e.accelerationIncludingGravity;
  if (!acc) return;

  let gyro = e.rotationRate || {alpha:0,beta:0,gamma:0};

  let a = acc[axis] || 0;
  let g = Math.abs(gyro.beta || 0);

  let dt = (now-lastTime)/1000 || 0.016;

  let norm = a - baseline;

  let jerk = (norm - lastAccel) / dt;
  jerk = Math.max(-60, Math.min(60, jerk));

  lastAccel = norm;
  lastTime = now;

  updateBar(norm);

  // ===== STATE MACHINE =====
  if (state==="idle") {
    if (norm < -7) {
      state="pullback";
    }
  }

  else if (state==="pullback") {
    if (norm > 15) {
      state="forward";
      peakAccel = norm;
      peakGyro = g;
      jerkPeak = Math.abs(jerk);
      startTime = now;
    }
  }

  else if (state==="forward") {

    peakAccel = Math.max(peakAccel, norm);
    peakGyro = Math.max(peakGyro, g);
    jerkPeak = Math.max(jerkPeak, Math.abs(jerk));

    if (norm < 2) {

      let duration = now - startTime;

      let score = calcScore(peakAccel, peakGyro, jerkPeak, duration);

      if (score > 0) {
        let type = classifyPunch(peakAccel, peakGyro, duration);
        showScore(score, type);
        vibrate(score);
      }

      reset();
    }
  }
}

// ================= SCORE =================
function calcScore(acc, gyro, jerk, duration) {

  if (duration < 70 || duration > 300) return 0;
  if (gyro < 40) return 0;
  if (jerk < 10) return 0;
  if (acc < 14) return 0;

  let raw =
    acc*0.5 +
    gyro*0.25 +
    jerk*0.2 +
    (150/duration)*0.05;

  let K = 40;

  let score = 9999 * Math.pow(1 - Math.exp(-raw/K), 2);

  return Math.min(9999, Math.floor(score));
}

// ================= CLASSIFIER =================
function classifyPunch(acc, gyro, duration) {

  if (gyro < 60 && duration < 180) return "JAB ⚡";

  if (gyro > 120) return "HOOK 🪝";

  if (duration > 180 && acc > 20) return "UPPERCUT ⬆️";

  return "STRAIGHT";
}

// ================= UI =================
function showScore(val, type) {

  let scoreEl = document.getElementById("score");
  scoreEl.innerText = val.toString().padStart(4,"0");

  scoreEl.style.transform = "scale(1.2)";
  setTimeout(()=>scoreEl.style.transform="scale(1)",150);

  document.getElementById("type").innerText = type;

  document.getElementById("status").innerText =
    val>8000 ? "🔥 EFSANE" :
    val>5000 ? "💪 Güçlü" :
    val>2000 ? "👍 İyi" :
    "😅 Zayıf";
}

function updateBar(v) {
  let p = Math.min(100, Math.max(0, v*3));
  document.getElementById("powerBar").style.width = p+"%";
}

// ================= VIBRATION =================
function vibrate(score) {
  if (!navigator.vibrate) return;

  let power = Math.min(200, score/20);

  navigator.vibrate([20, 10, power]);
}

// ================= RESET =================
function reset() {
  state="idle";
  peakAccel=0;
  peakGyro=0;
  jerkPeak=0;
  startTime=0;

  document.getElementById("status").innerText="Hazır - geri çek";
}
</script>

</body>
</html>
